[project]
name = "acmemind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hema_varshini_b", email = "hemavarshinius@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "openai",
    "openpyxl>=3.1.5",
    "pypdf>=7.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit",
]

[project.scripts]
acmemind = "acmemind:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
